name: Reporte diario de inversiones

on:
  schedule:
    - cron: '50 6 * * 1-5'
    - cron: '00 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install anthropic yfinance feedparser python-dotenv requests twilio pandas beautifulsoup4

      - name: Crear env
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > .env
          echo "TWILIO_SID=${{ secrets.TWILIO_SID }}" >> .env
          echo "TWILIO_TOKEN=${{ secrets.TWILIO_TOKEN }}" >> .env
          echo "TU_TELEFONO=${{ secrets.TU_TELEFONO }}" >> .env
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "GITHUB_REPO=${{ github.repository }}" >> .env

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restaurar historial
        run: |
          if [ -f historial_recomendaciones.json ]; then
            echo "Historial encontrado en el repo"
          else
            echo "[]" > historial_recomendaciones.json
            echo "Historial creado vacio"
          fi

      - name: Ejecutar agente
        run: python main.py

      - name: Guardar historial en repo
        run: |
          git add historial_recomendaciones.json datos_dashboard.json || true
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "historial: actualizar $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
