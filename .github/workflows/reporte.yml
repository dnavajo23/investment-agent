name: Reporte diario de inversiones

on:
  schedule:
    - cron: '50 6 * * 1-5'
    - cron: '00 14 * * 1-5'
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install anthropic yfinance feedparser python-dotenv requests twilio pandas beautifulsoup4

      - name: Crear env
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > .env
          echo "TWILIO_SID=${{ secrets.TWILIO_SID }}" >> .env
          echo "TWILIO_TOKEN=${{ secrets.TWILIO_TOKEN }}" >> .env
          echo "TU_TELEFONO=${{ secrets.TU_TELEFONO }}" >> .env
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Ejecutar agente
        run: python main.py
