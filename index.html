<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio · Seguimiento de inversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f14;
    --surface:  #141720;
    --surface2: #1c2030;
    --border:   rgba(255,255,255,0.07);
    --text:     #e8eaf0;
    --muted:    #6b7280;
    --green:    #22c55e;
    --red:      #ef4444;
    --blue:     #60a5fa;
    --amber:    #f59e0b;
    --purple:   #a78bfa;
    --mono:     'DM Mono', monospace;
    --sans:     'Syne', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .logo { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text); }
  .logo span { color: var(--green); }
  .updated { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }

  /* ── Layout ── */
  main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* ── Métricas globales ── */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 2.5rem;
  }
  .metric {
    background: var(--surface);
    padding: 1.25rem 1.5rem;
  }
  .metric-label {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  .metric-val {
    font-size: 1.75rem;
    font-weight: 700;
    line-height: 1;
  }
  .metric-sub { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-top: 0.35rem; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--muted); }

  /* ── Sección tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1.5rem;
    width: fit-content;
  }
  .tab {
    background: none;
    border: none;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 0.6rem 1.4rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    border-right: 1px solid var(--border);
  }
  .tab:last-child { border-right: none; }
  .tab.active { background: var(--surface2); color: var(--text); }
  .tab:hover:not(.active) { background: var(--surface); color: var(--text); }

  /* ── Tabla de posiciones ── */
  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
  }
  thead th {
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
    text-align: left;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    cursor: pointer;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td {
    padding: 0.9rem 1rem;
    vertical-align: middle;
  }
  .ticker-cell { display: flex; align-items: center; gap: 0.75rem; }
  .ticker-sym {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.2rem 0.5rem;
    white-space: nowrap;
  }
  .ticker-date { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

  /* ── Barra de progreso TP/SL ── */
  .progress-wrap { display: flex; align-items: center; gap: 0.6rem; min-width: 160px; }
  .bar-outer {
    flex: 1;
    height: 5px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: hidden;
    position: relative;
  }
  .bar-inner { height: 100%; border-radius: 99px; transition: width 0.5s; }
  .bar-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 0.6rem; color: var(--muted); margin-top: 3px; }

  /* ── Pills de estado ── */
  .pill {
    font-family: var(--mono);
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 0.2rem 0.6rem;
    border-radius: 99px;
    white-space: nowrap;
  }
  .pill-pos  { background: rgba(34,197,94,0.12);  color: var(--green); }
  .pill-neg  { background: rgba(239,68,68,0.12);  color: var(--red); }
  .pill-tp   { background: rgba(96,165,250,0.12); color: var(--blue); }
  .pill-sl   { background: rgba(245,158,11,0.12); color: var(--amber); }
  .pill-wait { background: rgba(107,114,128,0.15); color: var(--muted); }

  /* ── Detalle expandido ── */
  .detail-row td {
    padding: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .detail-inner {
    padding: 1.25rem 1.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1rem;
  }
  .detail-stat .ds-label { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
  .detail-stat .ds-val   { font-family: var(--mono); font-size: 0.9rem; font-weight: 500; }

  /* ── Gráfico rendimiento ── */
  .chart-section { margin-top: 1rem; }
  .chart-wrap { position: relative; height: 240px; }

  /* ── Estados vacío / carga ── */
  .empty {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 1rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    header { padding: 1rem; }
    main   { padding: 1rem; }
    .metrics { grid-template-columns: 1fr 1fr; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">portfolio<span>.</span>track</div>
  <div class="updated" id="updated-label">cargando…</div>
</header>

<main>

  <!-- Métricas globales -->
  <div class="metrics" id="metrics">
    <div class="metric"><div class="metric-label">Posiciones</div><div class="metric-val" id="m-total">—</div></div>
    <div class="metric"><div class="metric-label">En positivo</div><div class="metric-val" id="m-pos">—</div></div>
    <div class="metric"><div class="metric-label">P&L medio</div><div class="metric-val" id="m-pnl">—</div></div>
    <div class="metric"><div class="metric-label">TP alcanzados</div><div class="metric-val" id="m-tp">—</div></div>
    <div class="metric"><div class="metric-label">SL tocados</div><div class="metric-val" id="m-sl">—</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="activas">Activas</button>
    <button class="tab" data-tab="historial">Historial</button>
    <button class="tab" data-tab="rendimiento">Rendimiento</button>
  </div>

  <!-- Tab: Activas -->
  <div id="tab-activas">
    <div class="table-wrap">
      <table id="tbl-activas">
        <thead>
          <tr>
            <th>Activo</th>
            <th>Entrada</th>
            <th>Precio actual</th>
            <th>P&L</th>
            <th class="hide-mobile">Progreso TP/SL</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tbody-activas">
          <tr><td colspan="6"><div class="empty"><div class="spinner"></div>Obteniendo precios en tiempo real…</div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Tab: Historial -->
  <div id="tab-historial" style="display:none">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Activo</th>
            <th>Fecha rec.</th>
            <th>Precio entrada</th>
            <th>Take profit</th>
            <th>Stop loss</th>
            <th class="hide-mobile">Días abierta</th>
          </tr>
        </thead>
        <tbody id="tbody-hist"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab: Rendimiento -->
  <div id="tab-rendimiento" style="display:none">
    <div class="chart-section">
      <div class="chart-wrap">
        <canvas id="chart-rend" role="img" aria-label="Gráfico de evolución del P&L medio por semana">Datos de rendimiento semanal.</canvas>
      </div>
    </div>
  </div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ── Configuración ──────────────────────────────────────────────────────────
// Cambia esta URL por la de tu GitHub Pages + el path al JSON
// Ejemplo: https://tuusuario.github.io/tu-repo/datos_dashboard.json
const DATOS_URL = './datos_dashboard.json';

// Para precios en tiempo real usamos la API pública de Yahoo Finance vía proxy CORS
const PRICE_BASE = 'https://query1.finance.yahoo.com/v8/finance/chart/';

// ── Estado ─────────────────────────────────────────────────────────────────
let posiciones = [];
let precios = {};   // { ticker: { precio, cambio1d } }

// ── Utils ──────────────────────────────────────────────────────────────────
const fmt  = (n, dec=2) => n == null ? '—' : Number(n).toFixed(dec);
const fmtP = (n) => n == null ? '—' : (n >= 0 ? '+' : '') + fmt(n) + '%';
const dias = (f) => Math.max(0, Math.round((Date.now() - new Date(f)) / 86400000));

function pnlPct(precio, actual) {
  if (!precio || !actual) return null;
  return (actual / precio - 1) * 100;
}

function estadoPill(pos, actual) {
  if (!actual) return { label: 'Sin precio', cls: 'pill-wait' };
  if (pos.take_profit && actual >= pos.take_profit) return { label: 'Objetivo ✓', cls: 'pill-tp' };
  if (pos.stop_loss   && actual <= pos.stop_loss)   return { label: 'Stop loss', cls: 'pill-sl' };
  const p = pnlPct(pos.precio, actual);
  if (p >= 0) return { label: 'En positivo', cls: 'pill-pos' };
  return { label: 'En negativo', cls: 'pill-neg' };
}

function barPct(pos, actual) {
  const sl = pos.stop_loss;
  const tp = pos.take_profit;
  if (!sl || !tp || !actual) return 50;
  const rng = tp - sl;
  return Math.min(100, Math.max(0, Math.round(((actual - sl) / rng) * 100)));
}

function barColor(pos, actual) {
  if (!actual) return '#6b7280';
  if (pos.take_profit && actual >= pos.take_profit) return '#60a5fa';
  if (pos.stop_loss   && actual <= pos.stop_loss)   return '#f59e0b';
  return actual >= pos.precio ? '#22c55e' : '#ef4444';
}

// ── Carga de datos ─────────────────────────────────────────────────────────
async function cargarDatos() {
  try {
    const r = await fetch(DATOS_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error('No se pudo cargar el JSON');
    const data = await r.json();
    posiciones = data.posiciones || [];
    document.getElementById('updated-label').textContent = 'datos al ' + (data.actualizado || '—');
    await cargarPrecios();
    renderTodo();
  } catch(e) {
    document.getElementById('tbody-activas').innerHTML =
      `<tr><td colspan="6"><div class="empty">⚠ No se pudo cargar datos_dashboard.json<br><small>${e.message}</small></div></td></tr>`;
  }
}

async function cargarPrecios() {
  const chunk = 8; // Yahoo tolera hasta ~10 por petición
  const tickers = posiciones.map(p => p.ticker);
  for (let i = 0; i < tickers.length; i += chunk) {
    const grupo = tickers.slice(i, i + chunk);
    await Promise.allSettled(grupo.map(fetchPrecio));
  }
}

async function fetchPrecio(ticker) {
  try {
    const url = `${PRICE_BASE}${encodeURIComponent(ticker)}?interval=1d&range=2d`;
    const r = await fetch(url);
    if (!r.ok) return;
    const data = await r.json();
    const meta = data?.chart?.result?.[0]?.meta;
    if (!meta) return;
    const actual = meta.regularMarketPrice ?? meta.previousClose;
    const prev   = meta.chartPreviousClose ?? meta.previousClose;
    precios[ticker] = {
      precio:   actual,
      cambio1d: prev ? ((actual / prev) - 1) * 100 : null,
    };
  } catch(_) {}
}

// ── Render principal ───────────────────────────────────────────────────────
function renderTodo() {
  renderMetricas();
  renderTablaActivas();
  renderTablaHist();
  renderGrafico();
}

function renderMetricas() {
  const total = posiciones.length;
  if (total === 0) return;

  let pos = 0, tp = 0, sl = 0, pnlSum = 0, pnlCount = 0;
  for (const p of posiciones) {
    const actual = precios[p.ticker]?.precio;
    const pnl = pnlPct(p.precio, actual);
    if (pnl != null) { pnlSum += pnl; pnlCount++; }
    if (pnl != null && pnl >= 0) pos++;
    if (p.take_profit && actual >= p.take_profit) tp++;
    if (p.stop_loss   && actual <= p.stop_loss)   sl++;
  }

  const pnlMedio = pnlCount ? pnlSum / pnlCount : null;

  document.getElementById('m-total').textContent = total;
  const mPos = document.getElementById('m-pos');
  mPos.textContent = `${pos}/${total}`;
  mPos.className = 'metric-val ' + (pos >= total/2 ? 'pos' : 'neg');

  const mPnl = document.getElementById('m-pnl');
  mPnl.textContent = pnlMedio != null ? fmtP(pnlMedio) : '—';
  mPnl.className = 'metric-val ' + (pnlMedio >= 0 ? 'pos' : 'neg');

  document.getElementById('m-tp').textContent = tp;
  document.getElementById('m-sl').textContent = sl;
}

let expandedRow = null;

function renderTablaActivas() {
  const tbody = document.getElementById('tbody-activas');
  if (posiciones.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty">No hay posiciones activas</div></td></tr>';
    return;
  }

  // Ordenar por P&L desc
  const sorted = [...posiciones].sort((a, b) => {
    const pa = pnlPct(a.precio, precios[a.ticker]?.precio) ?? -999;
    const pb = pnlPct(b.precio, precios[b.ticker]?.precio) ?? -999;
    return pb - pa;
  });

  tbody.innerHTML = '';
  sorted.forEach((pos, i) => {
    const actual  = precios[pos.ticker]?.precio;
    const pnl     = pnlPct(pos.precio, actual);
    const estado  = estadoPill(pos, actual);
    const bp      = barPct(pos, actual);
    const bc      = barColor(pos, actual);
    const pnlCls  = pnl == null ? 'neu' : pnl >= 0 ? 'pos' : 'neg';

    // Fila principal
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    tr.innerHTML = `
      <td>
        <div class="ticker-cell">
          <div>
            <div class="ticker-sym">${pos.ticker}</div>
            <div class="ticker-date">${pos.fecha}</div>
          </div>
        </div>
      </td>
      <td style="font-family:var(--mono);font-size:0.8rem;">$${fmt(pos.precio)}</td>
      <td style="font-family:var(--mono);font-size:0.8rem;">${actual ? '$'+fmt(actual) : '—'}</td>
      <td class="${pnlCls}" style="font-family:var(--mono);font-size:0.8rem;font-weight:500;">${fmtP(pnl)}</td>
      <td class="hide-mobile">
        <div style="min-width:140px;">
          <div class="progress-wrap">
            <div class="bar-outer">
              <div class="bar-inner" style="width:${bp}%;background:${bc};"></div>
            </div>
            <span style="font-family:var(--mono);font-size:0.65rem;color:var(--muted);min-width:28px;">${bp}%</span>
          </div>
          <div class="bar-labels">
            <span>SL${pos.stop_loss ? ' $'+fmt(pos.stop_loss,0) : ''}</span>
            <span>TP${pos.take_profit ? ' $'+fmt(pos.take_profit,0) : ''}</span>
          </div>
        </div>
      </td>
      <td><span class="pill ${estado.cls}">${estado.label}</span></td>
    `;

    // Fila de detalle (oculta)
    const trDet = document.createElement('tr');
    trDet.className = 'detail-row';
    trDet.style.display = 'none';
    const c1d = precios[pos.ticker]?.cambio1d;
    trDet.innerHTML = `
      <td colspan="6">
        <div class="detail-inner">
          <div class="detail-stat"><div class="ds-label">Take profit</div><div class="ds-val">${pos.take_profit ? '$'+fmt(pos.take_profit) : '—'}</div></div>
          <div class="detail-stat"><div class="ds-label">Stop loss</div><div class="ds-val">${pos.stop_loss ? '$'+fmt(pos.stop_loss) : '—'}</div></div>
          <div class="detail-stat"><div class="ds-label">Cambio hoy</div><div class="ds-val ${c1d==null?'neu':c1d>=0?'pos':'neg'}">${fmtP(c1d)}</div></div>
          <div class="detail-stat"><div class="ds-label">Días abierta</div><div class="ds-val">${dias(pos.fecha)}d</div></div>
          <div class="detail-stat"><div class="ds-label">Precio entrada</div><div class="ds-val">$${fmt(pos.precio)}</div></div>
          <div class="detail-stat"><div class="ds-label">Precio actual</div><div class="ds-val">${actual ? '$'+fmt(actual) : '—'}</div></div>
        </div>
      </td>
    `;

    tr.addEventListener('click', () => {
      const isOpen = trDet.style.display !== 'none';
      // Cerrar el anterior si es distinto
      if (expandedRow && expandedRow !== trDet) expandedRow.style.display = 'none';
      trDet.style.display = isOpen ? 'none' : '';
      expandedRow = isOpen ? null : trDet;
    });

    tbody.appendChild(tr);
    tbody.appendChild(trDet);
  });
}

function renderTablaHist() {
  const tbody = document.getElementById('tbody-hist');
  if (posiciones.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty">Sin historial</div></td></tr>';
    return;
  }
  const sorted = [...posiciones].sort((a,b) => b.fecha.localeCompare(a.fecha));
  tbody.innerHTML = sorted.map(pos => `
    <tr>
      <td><div class="ticker-cell"><div class="ticker-sym">${pos.ticker}</div></div></td>
      <td style="font-family:var(--mono);font-size:0.75rem;color:var(--muted);">${pos.fecha}</td>
      <td style="font-family:var(--mono);font-size:0.8rem;">$${fmt(pos.precio)}</td>
      <td style="font-family:var(--mono);font-size:0.8rem;color:var(--green);">${pos.take_profit ? '$'+fmt(pos.take_profit) : '—'}</td>
      <td style="font-family:var(--mono);font-size:0.8rem;color:var(--red);">${pos.stop_loss ? '$'+fmt(pos.stop_loss) : '—'}</td>
      <td style="font-family:var(--mono);font-size:0.8rem;color:var(--muted);">${dias(pos.fecha)}d</td>
    </tr>
  `).join('');
}

let chartInst = null;
function renderGrafico() {
  if (posiciones.length === 0) return;

  // Agrupar P&L por semana (usando fecha de la recomendación)
  const semanas = {};
  for (const pos of posiciones) {
    const actual = precios[pos.ticker]?.precio;
    const pnl = pnlPct(pos.precio, actual);
    if (pnl == null) continue;
    const d = new Date(pos.fecha);
    // Lunes de esa semana como clave
    const lunes = new Date(d);
    lunes.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const key = lunes.toISOString().slice(0,10);
    if (!semanas[key]) semanas[key] = [];
    semanas[key].push(pnl);
  }

  const labels  = Object.keys(semanas).sort();
  const valores  = labels.map(k => {
    const arr = semanas[k];
    return parseFloat((arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(2));
  });

  const colores = valores.map(v => v >= 0 ? 'rgba(34,197,94,0.7)' : 'rgba(239,68,68,0.7)');

  if (chartInst) { chartInst.destroy(); chartInst = null; }
  chartInst = new Chart(document.getElementById('chart-rend'), {
    type: 'bar',
    data: {
      labels: labels.map(l => {
        const d = new Date(l);
        return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
      }),
      datasets: [{
        label: 'P&L medio (%)',
        data: valores,
        backgroundColor: colores,
        borderRadius: 4,
        barPercentage: 0.6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6b7280', font: { size: 11 } } },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#6b7280',
            font: { size: 11 },
            callback: v => (v >= 0 ? '+' : '') + v + '%'
          }
        }
      }
    }
  });
}

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    ['activas','historial','rendimiento'].forEach(id => {
      document.getElementById('tab-'+id).style.display = id === btn.dataset.tab ? '' : 'none';
    });
  });
});

// ── Auto-refresh cada 5 min ────────────────────────────────────────────────
cargarDatos();
setInterval(async () => {
  await cargarPrecios();
  renderTodo();
}, 5 * 60 * 1000);
</script>
